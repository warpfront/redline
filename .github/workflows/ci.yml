#
# GPU-free continuous integration.
#
# Redline loads the public ROCr/HSA runtime via dlopen at *runtime*
# (crates/redline-rocr uses libloading; there is no build.rs and no link-time
# -lhsa-runtime64), so the entire workspace compiles and unit-tests on a stock
# runner with no GPU and no ROCm installed. Everything that actually dispatches
# — the C-ABI smoke harnesses under crates/redline-capi/examples, the
# hipfire-6409 matrix, scripts/6529-*.sh — needs real RDNA hardware and is
# deliberately NOT run here.
#
# All four jobs are load-bearing and intended to be required status checks.
#
# `fmt` and `clippy` started advisory, because when CI first landed the repo
# predated it and carried real debt: 17 files failed `cargo fmt --check` and
# clippy reported 80 warnings, dominated by missing `# Safety` sections on unsafe
# fns and an oversized `Err` variant. Denying warnings then would have redded the
# build on legacy code and taught everyone to ignore CI. That debt was paid down
# in #8, so the gates now enforce what they previously only annotated: rustfmt
# checks the whole workspace rather than just the files a PR touches, and clippy
# runs with `-D warnings`.

name: CI

on:
  pull_request:
  push:
    branches: [master]

# Supersede in-flight runs when a PR gets new pushes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # NOTE: deliberately NOT setting `RUSTFLAGS: -D warnings` yet. See the header.

jobs:
  build:
    name: build (workspace, no GPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # --all-targets so examples and test targets are type-checked too: the
      # crates/*/examples binaries are how contributors exercise real hardware,
      # and a broken example is a broken repro.
      - name: Build workspace (lib + bins + examples + tests)
        run: cargo build --release --workspace --all-targets --locked

  test:
    name: unit tests (no GPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The workspace test suite is host-side: PM4 packet encoding, stream
      # validation, device-identity resolution, manifest parsing, recipe
      # certification. None of it touches /dev/kfd. The handful of tests that
      # need an installed toolchain probe for it and skip when absent — the
      # hipcc checks in radiowave, and redline-hipgraph's RTLD_LOCAL symbol
      # resolution test, which needs libamdhip64.so loader-visible but no GPU.
      # Tests that genuinely dispatch are opt-in behind REDLINE_TEST_HIP /
      # REDLINE_TEST_AQL and stay off here.
      - name: Run workspace tests
        run: cargo test --workspace --locked

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    # Whole-workspace now that the tree is clean. This previously checked only
    # the files a PR touched, because a workspace-wide check would have been red
    # from the day CI landed; that helper script is gone with the debt.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # -D warnings: the workspace is at zero, so anything new is a regression
      # introduced by the change under review, not inherited debt.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

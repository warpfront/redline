[workspace]
members = [
    "crates/radiowave",
    "crates/redline-dispatch",
    "crates/redline-rocr",
    "crates/redline-observe",
    "crates/redline-capi",
    "crates/redline-hipgraph",
]
exclude = ["crates/redline-py"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["Kaden Schutt"]
repository = "https://github.com/Kaden-Schutt/redline"
homepage = "https://github.com/Kaden-Schutt/redline"

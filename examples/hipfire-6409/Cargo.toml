[package]
name = "hipfire-6409-bench"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
build = "build.rs"

[workspace]

[dependencies]
anyhow = "1"
ash = "0.38"
hip-bridge = { git = "https://github.com/Kaden-Schutt/hipfire.git", rev = "455ffb9dfd6a5712889b504737f88fbbe87d3efe" }
half = "2"
radiowave = { path = "../../crates/radiowave" }
redline-dispatch = { path = "../../crates/redline-dispatch" }
redline-observe = { path = "../../crates/redline-observe" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[build-dependencies]
anyhow = "1"
radiowave = { path = "../../crates/radiowave" }

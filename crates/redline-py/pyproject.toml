[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "redline-dispatch"
version = "0.1.0"
description = "Python bindings for redline-dispatch — a leaner, safer HipGraph"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "Kaden Schutt" }]
readme = "README.md"

[tool.maturin]
module-name = "redline_dispatch"
manifest-path = "Cargo.toml"

[package]
name = "redline-py"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Kaden Schutt"]
repository = "https://github.com/Kaden-Schutt/redline"
description = "Python bindings for redline-dispatch — a leaner, safer HipGraph"

# Standalone workspace root. This crate is excluded from the redline workspace
# and lives under a git worktree nested inside the main checkout. Without this
# table cargo walks up past the worktree and resolves the main checkout as the
# workspace root (which does not list this crate as a member), which breaks
# `maturin build` / `cargo metadata` from inside the worktree.
[workspace]

[lib]
name = "redline_dispatch"
crate-type = ["cdylib"]

[dependencies]
radiowave = { path = "../radiowave" }
redline_core = { path = "../redline-dispatch", package = "redline-dispatch" }
pyo3 = { version = "0.24", features = ["extension-module", "abi3-py39"] }

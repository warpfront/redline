[package]
name = "radiowave"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Policy-driven HIP compiler and AMDGPU code-object inspector for Redline"

[features]
default = []
# Experimental gfx12 OCP FP8 recipe catalog (Wave 2+). Off by default.
experimental-fp8 = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
thiserror = "2.0.17"

[[bin]]
name = "radiowave"
path = "src/main.rs"

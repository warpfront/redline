[package]
name = "redline-capi"
version.workspace = true
edition = "2024"
license = "Apache-2.0"
authors = ["Kaden Schutt"]
repository = "https://github.com/Kaden-Schutt/redline"
description = "C ABI for redline-dispatch — a leaner, safer HipGraph, callable from C/C++"

[lib]
name = "redline_dispatch"
crate-type = ["staticlib", "cdylib"]

[dependencies]
radiowave = { path = "../radiowave" }
redline-dispatch = { path = "../redline-dispatch" }
